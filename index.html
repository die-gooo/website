<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Me</title>
  <!-- Google Analytics GA4 — sostituisci G-XXXXXXXXXX con il tuo Measurement ID -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-8PQN90VD28"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){ dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', 'G-8PQN90VD28');
  </script>

  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@300&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #f7f5f2;
      --ink: #1a1814;
      --accent: #c8a96e;
      --muted: #9e9890;
    }

    html, body {
      height: 100%;
      width: 100%;
    }

    body {
      background-color: var(--bg);
      font-family: 'Bebas Neue', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      cursor: none;
    }

    /* Custom cursor */
    .cursor {
      position: fixed;
      width: 6px;
      height: 6px;
      background: var(--ink);
      border-radius: 50%;
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%);
      transition: transform 0.1s ease, width 0.3s ease, height 0.3s ease, background 0.3s ease;
    }

    .cursor.hover {
      width: 32px;
      height: 32px;
      background: transparent;
      border: 1px solid var(--accent);
    }

    /* Noise texture overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
      background-size: 150px 150px;
      pointer-events: none;
      z-index: 1;
      opacity: 0.4;
    }

    /* Thin horizontal rule - top */
    .line-top,
    .line-bottom {
      position: fixed;
      left: 48px;
      right: 48px;
      height: 1px;
      background: var(--ink);
      opacity: 0.12;
    }
    .line-top { top: 48px; }
    .line-bottom { bottom: 48px; }

    /* Corner markers */
    .corner {
      position: fixed;
      width: 12px;
      height: 12px;
      opacity: 0.25;
    }
    .corner::before,
    .corner::after {
      content: '';
      position: absolute;
      background: var(--ink);
    }
    .corner::before { width: 1px; height: 100%; left: 0; top: 0; }
    .corner::after  { width: 100%; height: 1px; left: 0; top: 0; }

    .corner.tl { top: 48px; left: 48px; }
    .corner.tr { top: 48px; right: 48px; transform: scaleX(-1); }
    .corner.bl { bottom: 48px; left: 48px; transform: scaleY(-1); }
    .corner.br { bottom: 48px; right: 48px; transform: scale(-1); }

    /* Center content */
    .center {
      position: relative;
      z-index: 2;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
    }

    /* Year / small text */
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(4.5rem, 14vw, 12rem);
      font-weight: 400;
      letter-spacing: 0.06em;
      line-height: 0.95;
      color: var(--ink);
      opacity: 0;
      animation: fadeUp 1.1s cubic-bezier(0.22, 1, 0.36, 1) 0.45s forwards;
    }

    .headline em {
      font-style: normal;
      color: var(--accent);
    }

    /* Year / small text */
    .year {
      position: fixed;
      bottom: 56px;
      right: 64px;
      font-size: 0.68rem;
      letter-spacing: 0.2em;
      color: var(--muted);
      opacity: 0.6;
      font-weight: 300;
    }

    /* Animations */
    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(18px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 600px) {
      .line-top, .line-bottom { left: 24px; right: 24px; }
      .corner.tl { top: 24px; left: 24px; }
      .corner.tr { top: 24px; right: 24px; }
      .corner.bl { bottom: 24px; left: 24px; }
      .corner.br { bottom: 24px; right: 24px; }
      .year { bottom: 30px; right: 32px; }
    }
  </style>
</head>
<body>

  <div class="cursor" id="cursor"></div>

  <div class="line-top"></div>
  <div class="line-bottom"></div>
  <div class="corner tl"></div>
  <div class="corner tr"></div>
  <div class="corner bl"></div>
  <div class="corner br"></div>

  <main class="center">
    <h1 class="headline">Contact <em>me</em></h1>
  </main>

  <span class="year">© 2026</span>

  <script>
    const cursor = document.getElementById('cursor');

    document.addEventListener('mousemove', e => {
      cursor.style.left = e.clientX + 'px';
      cursor.style.top  = e.clientY + 'px';
    });
  </script>

</body>
</html>
